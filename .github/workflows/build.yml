EOF

      - name: Upload Mod Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLoot-Extended-Jars
          path: release_jars/*.jar

      - name: Publish Versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Virtual Loot: Extended [${{ env.MC_VERSION }}] ${{ env.RELEASE_TAG }} - ${{ env.VERSION_SUBTITLE }}"
          body_path: release_body.md
          prerelease: ${{ env.VERSION_TYPE != 'Release' }}
          make_latest: true
          files: release_jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

