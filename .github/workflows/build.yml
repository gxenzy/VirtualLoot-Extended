name: Build & Release Virtual Loot (Extended Edition)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version Type (Release, Beta, Alpha)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Beta
          - Alpha
      custom_title:
        description: 'Custom Version Title (e.g. 3D Visual Projections & Universal Cobblebase Integration)'
        required: false
        default: '3D Visual Projections & Universal Cobblebase Integration'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Clean Production JARs
        run: |
          mkdir -p release_jars
          find fabric/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          find neoforge/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          echo "Cleaned production jars:"
          ls -la release_jars/

      - name: Extract Metadata & Configuration
        id: meta
        run: |
          MOD_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          
          VER_TYPE="${{ github.event.inputs.version_type }}"
          if [ -z "$VER_TYPE" ]; then
            if [[ "$GITHUB_REF" == *"alpha"* ]]; then
              VER_TYPE="Alpha"
            elif [[ "$GITHUB_REF" == *"beta"* ]]; then
              VER_TYPE="Beta"
            else
              VER_TYPE="Release"
            fi
          fi
          
          SUBTITLE="${{ github.event.inputs.custom_title }}"
          if [ -z "$SUBTITLE" ]; then
            SUBTITLE="3D Visual Projections & Universal Cobblebase Integration"
          fi
          
          TAG="v${MOD_VER}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          echo "MOD_VERSION=$MOD_VER" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VER" >> $GITHUB_ENV
          echo "VERSION_TYPE=$VER_TYPE" >> $GITHUB_ENV
          echo "VERSION_SUBTITLE=$SUBTITLE" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Generate Dynamic Release Notes Body
        shell: python
        run: |
          import os, subprocess, hashlib, glob, re

          def get_prop(k):
              with open('gradle.properties', 'r', encoding='utf-8') as f:
                  for l in f:
                      if l.startswith(k + '='):
                          return l.strip().split('=', 1)[1]
              return ''

          def fmt_sz(b):
              for u in ['B', 'KB', 'MB', 'GB']:
                  if b < 1024.0:
                      return f"{b:.2f} {u}"
                  b /= 1024.0
              return f"{b:.2f} TB"

          def get_sha(p):
              s = hashlib.sha256()
              with open(p, 'rb') as f:
                  while chunk := f.read(65536):
                      s.update(chunk)
              return s.hexdigest()

          mod_ver = get_prop('mod_version')
          mc_ver = get_prop('minecraft_version')
          cobblemon_ver = get_prop('cobblemon_version')
          arch_ver = get_prop('architectury_api_version')
          fabric_ver = get_prop('fabric_api_version')
          neo_ver = get_prop('neoforge_version')
          breeding_ver = get_prop('cobbreeding_version')
          workers_ver = get_prop('cobbleworkers_version')

          ver_type = os.environ.get('VERSION_TYPE', 'Release')
          subtitle = os.environ.get('VERSION_SUBTITLE', '3D Visual Projections & Universal Cobblebase Integration')
          release_tag = os.environ.get('RELEASE_TAG', f"v{mod_ver}")
          repo = os.environ.get('GITHUB_REPOSITORY', 'gxenzy/VirtualLoot-Extended')
          repo_url = f"https://github.com/{repo}"

          subprocess.run(['git', 'fetch', '--tags', '--force'], capture_output=True)
          tag_proc = subprocess.run(['git', 'tag', '--sort=-creatordate'], capture_output=True, text=True)
          all_tags = [t.strip() for t in tag_proc.stdout.splitlines() if t.strip() and t.strip() != release_tag]

          if all_tags and release_tag != 'v1.0.0':
              prev_tag = all_tags[0]
              range_spec = f"{prev_tag}..HEAD"
              range_title = f"Changes since {prev_tag}"
              compare_link = f"[Full Diff View]({repo_url}/compare/{prev_tag}...{release_tag})"
          else:
              range_spec = ''
              range_title = 'Complete Version Changelog (All Project Commits)'
              compare_link = f"[Repository Tree]({repo_url}/tree/{release_tag})"

          git_cmd = ['git', 'log', '--pretty=format:%h|%an|%s']
          if range_spec:
              git_cmd.append(range_spec)
          
          log_proc = subprocess.run(git_cmd, capture_output=True, text=True)
          commits = log_proc.stdout.splitlines()

          visual_log, cobblebase_log, compat_log, roam_log, perf_log, docs_log, chore_log, other_log = [], [], [], [], [], [], [], []

          for c in commits:
              if not c.strip() or '|' not in c:
                  continue
              h, _, title = c.split('|', 2)
              clean_title = title.strip()
              clean_title = re.sub(r'(?<!`)@([a-zA-Z0-9_-]+)(?!`)', r'`@\1`', clean_title)
              line = f"* {clean_title} ([{h}]({repo_url}/commit/{h}))"
              low = clean_title.lower()

              if any(k in low for k in ['visual', 'shader', 'wireframe', 'hologram', 'ghost', 'particle', 'beam', 'materializ']):
                  visual_log.append(line)
              elif any(k in low for k in ['cobblebase', 'job', 'produce', 'aura', 'adminscreen', 'admin_screen']):
                  cobblebase_log.append(line)
              elif any(k in low for k in ['compat', 'cobbreeding', 'cobbleworker', 'safety', 'crash', 'conflict']):
                  compat_log.append(line)
              elif any(k in low for k in ['roam', 'pasture', 'entity', 'wander', 'collision', 'raycast', 'floor', 'dispers']):
                  roam_log.append(line)
              elif any(k in low for k in ['perf', 'optimi', 'deadlock', 'freeze', 'zero-lag', 'sync', 'thread']):
                  perf_log.append(line)
              elif any(k in low for k in ['doc', 'readme', 'sprite', 'taxonom', 'database', 'audit', 'chronicle']):
                  docs_log.append(line)
              elif any(k in low for k in ['chore', 'ci', 'build', 'gradle', 'workflow', 'release']):
                  chore_log.append(line)
              else:
                  other_log.append(line)

          jar_rows = []
          for jar in sorted(glob.glob('release_jars/*.jar')):
              fname = os.path.basename(jar)
              size = fmt_sz(os.path.getsize(jar))
              sha = get_sha(jar)
              jar_rows.append(f"| `{fname}` | {size} | `{sha}` |")

          jar_table = "| Filename | File Size | SHA-256 Checksum |\n| :--- | :---: | :--- |\n" + "\n".join(jar_rows) if jar_rows else "*No release jars found.*"
          status_str = "Production Stable Build" if ver_type == 'Release' else "Development Build"

          body_parts = [
              f"> **Release Status:** **{ver_type}** ({status_str})  ",
              f"> **Target Minecraft:** `{mc_ver}`  ",
              f"> **Installation Scope:** **Client & Server**  ",
              f"> **Supported Mod Loaders:** Fabric, NeoForge  ",
              "",
              "---",
              "",
              "## Production Release Artifacts",
              jar_table,
              "",
              "---",
              "",
              "## Executive Feature Summary",
              "* **True Zero-Lag Virtual Pastures**: Full background automation of Cobblebase Palworld jobs, Cobbreeding egg incubation, and Cobbleworkers field tasks with 0 physical entity tick overhead in Mode 0 (OFF).",
              "* **3D Visual Projection Engine**: Switch between 3 client-side projection modes at the touch of a button:",
              "  * **Mode 1 (Cyber Wireframe)**: 3D vector-edge mesh projection.",
              "  * **Mode 2 (Sci-Fi Hologram)**: Translucent cyan energy silhouette with scanlines.",
              "  * **Mode 3 (Ethereal Ghost)**: Translucent spirit form with levitation drift and soul flame particles.",
              "  * **Teleport Materialization**: Spiral particle beams and dimensional teleport sounds on spawn and mode toggle.",
              "* **Strict Pasture Isolation**: Normal wooden Cobblemon pastures are completely isolated and render 100% authentic physical models and textures.",
              "* **Integrated 27-Slot Automation Container**: Built-in block storage collecting all harvested crops, ores, mob drops, and eggs with vanilla hopper, pipe, and chute compatibility.",
              "* **Interactive Draggable HUD**: In-game customizable overlay editor with coordinate persistence.",
              "",
              "---",
              "",
              f"## Automated Version Changelog ({range_title})",
              compare_link,
          ]

          if visual_log:
              body_parts.extend(["", "### 3D Projection Engine & Visual Shaders"] + visual_log)
          if cobblebase_log:
              body_parts.extend(["", "### Cobblebase & Virtual Job Simulation"] + cobblebase_log)
          if compat_log:
              body_parts.extend(["", "### Cross-Mod Compatibility & Crash Shields"] + compat_log)
          if roam_log:
              body_parts.extend(["", "### Pasture Roaming, Physics & Entity AI"] + roam_log)
          if perf_log:
              body_parts.extend(["", "### Performance, Networking & Zero-Lag Architecture"] + perf_log)
          if docs_log:
              body_parts.extend(["", "### Documentation, Item Sprites & Species Classification"] + docs_log)
          if chore_log:
              body_parts.extend(["", "### Build, Packaging & CI/CD Pipelines"] + chore_log)
          if other_log:
              body_parts.extend(["", "### Additional Updates"] + other_log)

          body_parts.extend([
              "",
              "---",
              "",
              "## Verified Compatibility Matrix",
              "| Dependency / Mod | Target Version | Loader | Notes |",
              "| :--- | :--- | :--- | :--- |",
              f"| **Minecraft** | `{mc_ver}` | Fabric / NeoForge | Base game engine |",
              f"| **Cobblemon** | `{cobblemon_ver}` | Fabric / NeoForge | Core Pokémon framework |",
              f"| **Architectury API** | `{arch_ver}` | Fabric / NeoForge | Cross-loader abstraction |",
              f"| **Fabric API** | `{fabric_ver}` | Fabric | Fabric event and registry bus |",
              f"| **NeoForge** | `{neo_ver}` | NeoForge | NeoForge mod platform |",
              "| **Cobblebase** | `>=2.0.0` | Fabric / NeoForge | 42+ Virtual Palworld jobs & team auras |",
              f"| **Cobbreeding** | `{breeding_ver}` | Fabric / NeoForge | Virtual egg incubation & Mirror Herb moves |",
              f"| **Cobbleworkers** | `{workers_ver}` | Fabric / NeoForge | Field tasks (Pickup, Fishing, Diving, Archaeology) |",
              "",
              "---",
              "",
              "## Open Source Credits & Attributions",
              "* **[LunazStudios](https://github.com/LunazStudios)** — Creator of the original *Cobblemon Virtual Loot*.",
              "* **[notlown](https://github.com/notlown)** — Creator of *Cobblebase*.",
              "* **[The Cobblemon Team](https://cobblemon.com/)** — Creators of Cobblemon.",
              "* **[ludichat](https://github.com/ludichat)** — Creator of *Cobbreeding*.",
              "* **[Accieo](https://github.com/Accieo)** — Creator of *Cobbleworkers*.",
              "* **gxenzy & Contributors** — Extended edition compatibility bridge, 3D visual projection engine, zero-push physics, draggable HUD editor, and automated release workflows.",
              "",
              "*Licensed under the [MIT License](LICENSE.txt).*"
          ])

          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write("\n".join(body_parts) + "\n")

      - name: Upload Mod Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLoot-Extended-Jars
          path: release_jars/*.jar

      - name: Publish Versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Virtual Loot: Extended [${{ env.MC_VERSION }}] ${{ env.RELEASE_TAG }} - ${{ env.VERSION_SUBTITLE }}"
          body_path: release_body.md
          prerelease: ${{ env.VERSION_TYPE != 'Release' }}
          make_latest: true
          files: release_jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

