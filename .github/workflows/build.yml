name: Build & Release Virtual Loot (Extended Edition)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version Type (Release, Beta, Alpha)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Beta
          - Alpha
      custom_title:
        description: 'Custom Version Subtitle (e.g. Cobblebase & Universal Integration)'
        required: false
        default: 'Cobblebase & Universal Integration'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Clean Production JARs
        run: |
          mkdir -p release_jars
          find fabric/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          find neoforge/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          echo "Cleaned production jars:"
          ls -la release_jars/

      - name: Extract Metadata & Changelog
        id: meta
        run: |
          MOD_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          
          # Determine Version Type
          VER_TYPE="${{ github.event.inputs.version_type }}"
          if [ -z "$VER_TYPE" ]; then
            if [[ "$GITHUB_REF" == *"alpha"* ]]; then
              VER_TYPE="Alpha"
            elif [[ "$GITHUB_REF" == *"beta"* ]]; then
              VER_TYPE="Beta"
            else
              VER_TYPE="Release"
            fi
          fi
          
          SUBTITLE="${{ github.event.inputs.custom_title }}"
          if [ -z "$SUBTITLE" ]; then
            SUBTITLE="Cobblebase & Universal Integration"
          fi
          
          TAG="v${MOD_VER}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          echo "MOD_VERSION=$MOD_VER" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VER" >> $GITHUB_ENV
          echo "VERSION_TYPE=$VER_TYPE" >> $GITHUB_ENV
          echo "VERSION_SUBTITLE=$SUBTITLE" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          
          # Extract commit changelog
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log -n 8 --pretty=format:"* %s (%h by @%an)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Comprehensive Release Notes Body
        run: |
          cat << 'EOF' > release_body.md
          # Virtual Loot: Extended [${{ env.MC_VERSION }}] v${{ env.MOD_VERSION }} - ${{ env.VERSION_SUBTITLE }}

          > **Version Type:** **${{ env.VERSION_TYPE }}** (${{ env.VERSION_TYPE == 'Release' && 'Stable Production' || 'Experimental / Testing' }})  
          > **Target Minecraft:** `1.21.1`  
          > **Environment:** **Client & Server: Required on both** (Works on Singleplayer & Dedicated Servers)  
          > **Supported Loaders:** Fabric, NeoForge  

          ---

          ## Metadata & Environment Information
          * **Mod Name:** Virtual Loot: Extended (`virtualloot`)
          * **Mod Loaders:** Fabric (>=0.19.3), NeoForge (>=21.1.234)
          * **Minecraft Version:** 1.21.1
          * **Cobblemon Version:** 1.7.3+ (also compatible with 1.7.0+)
          * **Java Runtime:** Java 21 (JDK 21+)
          * **Environment Compatibility:**
            * **Client & Server (Required on Both):** Adds custom Virtual Pasture blocks, models, textures, GUI buttons, network sync packets, and server-side virtual ticking logic.
            * **Singleplayer:** Fully supported out-of-the-box.
            * **Dedicated Multiplayer Server:** Fully supported. Install the `.jar` on both the server and player clients.

          ---

          ## Dependencies & Compatibility Matrix

          ### Required Dependencies
          | Dependency | Required Version | Loader | Notes |
          | :--- | :--- | :--- | :--- |
          | **Minecraft** | `1.21.1` | Both | Base Game |
          | **Cobblemon** | `>=1.7.3` | Both | Core Pokémon Framework |
          | **Architectury API** | `>=13.0.8` | Both | Cross-loader runtime abstraction |
          | **Fabric API** | `>=0.116.12` | Fabric | Required for Fabric Loader |
          | **NeoForge** | `>=21.1.234` | NeoForge | Required for NeoForge Loader |

          ### Supported Integrations & Related Addons
          | Mod | Recommended Version | Role / Feature | Notes |
          | :--- | :--- | :--- | :--- |
          | **Cobblebase** | `>=2.0.0` | Palworld-style Virtual Base Jobs | Executes Producer, Mining, Harvester, Finder, Auras & Buffs virtually |
          | **Cobbreeding** | `>=2.2.1` | Virtual Egg Breeding & Ticking | Generates eggs directly into pasture storage with PC GUI crash protection |
          | **Cobbleworkers** | `>=2.0.4` | Automated Worker Jobs | Pickup, Fishing, Diving, Archaeology virtual jobs |
          | **Cloth Config API** | `>=15.0.140` | Config screen helper | Required by Cobblebase / VirtualLoot config |
          | **Xaero's Minimap** | `>=24.7.0` | Minimap Base Waypoints | Integrates with Cobblebase base tracking |
          | **Iris / Sodium** | `>=1.7.0` | Shader & Performance Engines | Fully compatible with 3D visual projection shaders |

          ---

          ## Key Features & Improvements

          ### 1. Server Performance & Virtual Automation
          * **Zero Server Entity Lag:** Manage up to 16+ Pokémon per pasture block with **0 physical entities spawned**, eliminating server TPS drops, pathfinding spikes, and world entity clutter.
          * **27-Slot Internal Storage:** All generated produce, mined ores, crops, and drops are collected inside the block. Access anytime with **Shift + Right Click**.
          * **Hopper Automation:** Place vanilla or modded hoppers directly beneath the Virtual Pasture block to automatically drain all collected items into chests, barrels, or sorting systems.
          * **Relaxing / Idle Drops:** Pokémon set to Relax / Idle automatically generate their standard Cobblemon species defeat drop tables.

          ### 2. Client-Side 3D Visual Projection Engine
          * **Mode 1 (Cyber Wireframe):** Electric cyan 3D vector wireframe outlining all polygon edges (Quads, Triangles, Lines) with transparent interiors at high framerates (60-80+ FPS). Full support for dynamic geometry including Charizard tail flames and wing membranes.
          * **Mode 2 (Sci-Fi Hologram):** Glowing electric cyan holographic energy projection with real-time animated horizontal laser scanlines and fullbright emissive lighting without dark shadows.
          * **Mode 3 (Ethereal Ghost):** Natural Pokémon textures with 40% Spectator translucency, subtle soul flame mist, and hovering elevation.
          * **Mode 0 (Disabled):** Disables visual entities for maximum client performance.
          * **Zero-Push Physics:** Players can walk freely through visual Pokémon without being bumped or physically pushed.
          * **Terrain Alignment:** Clamps grounded visual models firmly to Minecraft's native terrain heightmaps and distributes spawns across non-overlapping radial angle slots.
          * **Spawn Effects:** High-density rising particle beam pillar, teleport audio cues, and smooth scale-in materialization vortex.

          ### 3. Cobblebase 2.0+ Full Palworld Jobs Bridge
          * **42+ Unique Jobs:** Virtual execution for Producer, 12 specialized Finder subtypes (Alchemist, Pharmacist, Architect, Excavator, Botanist, Collector, Scholar, Chef, Trainer, Armorer, Prospector, Smith), Mining, Harvester, Guard, Support Healers/Mentors, and Team Auras.
          * **Proficiency Cooldown Scaling:** Action cooldowns scale dynamically based on Pokémon skill proficiency rating (1 to 5 stars).
          * **Activity Log Sync:** Production history is logged directly to Cobblebase's in-game activity history GUI.
          * **Passive Team Buffs:** Passively ticks party aura buffs (Speed, Strength, Resistance, Healing, Shiny Charm) without requiring physical world mobs.

          ### 4. Cobbreeding & Cobbleworkers Integration
          * **Virtual Egg Breeding:** Ticks breeding timers, rolls IVs and shinies, and transfers Mirror Herb egg moves directly into pasture inventory.
          * **PC GUI Crash Protection:** Built-in safety shield prevents unhandled property query crashes when opening storage menus near vanilla blocks.
          * **Cobbleworkers Tasks:** Automated Pickup, Fishing, Diving, and Archaeology virtual job processing.

          ### 5. Interactive Draggable HUD Editor
          * Click the in-game `[⚙]` button to drag and reposition pasture overlays and control buttons anywhere on your screen.
          * Restored mouse clicking and dragging functionality to Pokémon selection list scrollbars.

          ---

          ## Version Changelog

          ### 3D Visual Projection Engine
          * **3 Projection Modes:** Added **Cyber Wireframe** (cyan vector lattice with transparent faces), **Sci-Fi Hologram** (animated horizontal laser scanlines and fullbright emissive glow), and **Ethereal Ghost** (40% Spectator translucency with soul flame mist).
          * **Zero-Push Collision:** Injected collision bypass to allow players to walk freely through visual models without physical obstruction or bumping.
          * **Terrain Elevation Snapping:** Clamped grounded visual entities to Minecraft's native `MOTION_BLOCKING` heightmaps.
          * **Spawn Effects & Animations:** Added 32-particle rising beam pillars, teleport sound cues, and smooth scale-in materialization vortex curves.
          * **Nametag Polish:** Delegated nameplate rendering to Cobblemon's native display formatting to eliminate duplicate level labels.

          ### Cobblebase 2.0+ & Palworld Job System
          * **42+ Virtual Base Jobs:** Background execution for Producer items (Wool, Silk, Milk, Eggs, Honey, Gems, Slime, Fuel, etc.), 12 Finder subtypes, Harvester, Mining, Fishing, Archaeology, and Combat Guards.
          * **Proficiency Cooldown Scaling:** Dynamic cooldown multiplier formula scaling from 1 to 5 stars (`1.67x` down to `0.33x`).
          * **Cobblebase Activity Log Sync:** Job completions are recorded directly in Cobblebase's in-game activity history.
          * **Team Aura Buffs:** Passively ticks party buffs (Speed II, Strength I, Resistance I, Healing, Shiny Charm luck multipliers).

          ### Storage, Breeding & Mod Compatibility
          * **27-Slot Internal Storage:** All generated resources, crops, ores, and eggs collect inside the block. Access anytime via **Shift + Right Click**.
          * **Automated Hopper Routing:** Pulls items automatically into chests or sorting networks via hoppers placed underneath.
          * **Cobbreeding Virtual Egg Bridge:** Virtual egg breeding timers, IV rolls, shiny chances, and Mirror Herb egg move transfers.
          * **PC GUI Crash Shield:** Intercepts property queries to safely prevent `IllegalArgumentException` crashes when opening PC storage near vanilla blocks.
          * **Cobbleworkers Tasks:** Automated Pickup, Fishing, Diving, and Archaeology virtual job processing.

          ### User Interface & Controls
          * **Interactive Draggable HUD:** In-game `[⚙]` button to drag and reposition the Pasture Stats overlay and control buttons to custom screen positions.
          * **Scrollbar Fix:** Restored mouse clicking and dragging functionality in pasture Pokémon selection scroll lists.

          ---

          ## Open Source Credits & Attributions
          * **[LunazStudios](https://github.com/LunazStudios)** — Creator of the original *Cobblemon Virtual Loot*.
          * **[notlown](https://github.com/notlown)** — Creator of *Cobblebase*.
          * **[The Cobblemon Team](https://cobblemon.com/)** — Creators of Cobblemon.
          * **[ludichat](https://github.com/ludichat)** — Creator of *Cobbreeding*.
          * **[Accieo](https://github.com/Accieo)** — Creator of *Cobbleworkers*.
          * **[The SVCMC Team](https://github.com/the-svcmc-team)** — Creators of *svc-holograms* for the holographic shader pipeline.
          * **gxenzy & Contributors** — Extended edition compatibility bridge, 3D visual projection engine, zero-push physics, draggable HUD editor, and automated release workflows.

          *Licensed under the [MIT License](LICENSE.txt).*
          EOF

      - name: Upload Mod Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLoot-Extended-Jars
          path: release_jars/*.jar

      - name: Publish Versioned GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Virtual Loot: Extended [${{ env.MC_VERSION }}] ${{ env.RELEASE_TAG }} - ${{ env.VERSION_SUBTITLE }}"
          body_path: release_body.md
          prerelease: ${{ env.VERSION_TYPE != 'Release' }}
          files: release_jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
