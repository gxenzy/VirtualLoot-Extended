name: Build & Release Virtual Loot (Extended Edition)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version Type (Release, Beta, Alpha)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Beta
          - Alpha
      custom_title:
        description: 'Custom Version Subtitle (e.g. Cobblebase & Universal Integration)'
        required: false
        default: 'Cobblebase & Universal Integration'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Clean Production JARs
        run: |
          mkdir -p release_jars
          find fabric/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          find neoforge/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          echo "Cleaned production jars:"
          ls -la release_jars/

      - name: Extract Metadata & Changelog
        id: meta
        run: |
          MOD_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          
          # Determine Version Type
          VER_TYPE="${{ github.event.inputs.version_type }}"
          if [ -z "$VER_TYPE" ]; then
            if [[ "$GITHUB_REF" == *"alpha"* ]]; then
              VER_TYPE="Alpha"
            elif [[ "$GITHUB_REF" == *"beta"* ]]; then
              VER_TYPE="Beta"
            else
              VER_TYPE="Release"
            fi
          fi
          
          SUBTITLE="${{ github.event.inputs.custom_title }}"
          if [ -z "$SUBTITLE" ]; then
            SUBTITLE="Cobblebase & Universal Integration"
          fi
          
          TAG="v${MOD_VER}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          echo "MOD_VERSION=$MOD_VER" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VER" >> $GITHUB_ENV
          echo "VERSION_TYPE=$VER_TYPE" >> $GITHUB_ENV
          echo "VERSION_SUBTITLE=$SUBTITLE" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          
          # Extract commit changelog
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log -n 8 --pretty=format:"* %s (%h by @%an)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Dynamic Release Notes Body
        run: |
          # 1. Parse versions dynamically from gradle.properties
          MOD_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          COBBLEMON_VER=$(grep "cobblemon_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          ARCH_VER=$(grep "architectury_api_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          FABRIC_VER=$(grep "fabric_api_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          NEO_VER=$(grep "neoforge_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          BREEDING_VER=$(grep "cobbreeding_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          WORKERS_VER=$(grep "cobbleworkers_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          REPO_URL="https://github.com/${{ github.repository }}"

          # 2. Determine git range for dynamic changelog
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            RANGE_TITLE="Changes since ${PREV_TAG}"
            COMPARE_LINK="[Full Changelog & Diff](${REPO_URL}/compare/${PREV_TAG}...${RELEASE_TAG})"
          else
            RANGE="HEAD"
            RANGE_TITLE="Complete Version History"
            COMPARE_LINK="[Initial Release Tree](${REPO_URL}/tree/${RELEASE_TAG})"
          fi

          # 3. Categorize commits dynamically
          FEAT_LOG=""
          FIX_LOG=""
          VISUAL_LOG=""
          PERF_LOG=""
          DOCS_LOG=""
          CHORE_LOG=""
          OTHER_LOG=""

          while IFS='|' read -r hash author title; do
            [ -z "$hash" ] && continue
            LINE="* ${title} ([${hash}](${REPO_URL}/commit/${hash})) - @${author}"
            case "${title,,}" in
              *feat\(visual*|*fix\(visual*|*feat*visual*|*fix*visual*|*shader*|*wireframe*|*hologram*|*ghost*)
                VISUAL_LOG="${VISUAL_LOG}"$'\n'"${LINE}"
                ;;
              *feat*|*feature*)
                FEAT_LOG="${FEAT_LOG}"$'\n'"${LINE}"
                ;;
              *fix*|*crash*|*compat*|*safety*)
                FIX_LOG="${FIX_LOG}"$'\n'"${LINE}"
                ;;
              *perf*|*optimi*|*deadlock*|*freeze*)
                PERF_LOG="${PERF_LOG}"$'\n'"${LINE}"
                ;;
              *doc*|*readme*|*audit*|*changelog*)
                DOCS_LOG="${DOCS_LOG}"$'\n'"${LINE}"
                ;;
              *chore*|*ci*|*build*|*gradle*|*config*)
                CHORE_LOG="${CHORE_LOG}"$'\n'"${LINE}"
                ;;
              *)
                OTHER_LOG="${OTHER_LOG}"$'\n'"${LINE}"
                ;;
            esac
          done < <(git log ${RANGE} --pretty=format:"%h|%an|%s")

          # 4. Generate dynamic file checksum table
          JAR_TABLE="| Filename | File Size | SHA-256 Checksum |"$'\n'"| :--- | :---: | :--- |"
          for jar in release_jars/*.jar; do
            if [ -f "$jar" ]; then
              FNAME=$(basename "$jar")
              FSIZE=$(ls -lh "$jar" | awk '{print $5}')
              FSHA=$(sha256sum "$jar" | awk '{print $1}')
              JAR_TABLE="${JAR_TABLE}"$'\n'"| \`${FNAME}\` | ${FSIZE} | \`${FSHA}\` |"
            fi
          done

          # 5. Assemble dynamic release_body.md
          cat << EOF > release_body.md
          # Virtual Loot: Extended [${MC_VER}] ${RELEASE_TAG} - ${{ env.VERSION_SUBTITLE }}

          > **Release Status:** **${{ env.VERSION_TYPE }}** (${{ env.VERSION_TYPE == 'Release' && 'Production Build' || 'Testing Build' }})  
          > **Target Minecraft:** \`${MC_VER}\`  
          > **Required On:** **Client & Server**  
          > **Supported Platforms:** Fabric, NeoForge  

          ---

          ## Production Release Artifacts
          ${JAR_TABLE}

          ---

          ## Automated Version Changelog (${RANGE_TITLE})
          ${COMPARE_LINK}
          EOF

          if [ -n "$FEAT_LOG" ]; then
            cat << EOF >> release_body.md

          ### New Features & Subsystems
          ${FEAT_LOG}
          EOF
          fi

          if [ -n "$VISUAL_LOG" ]; then
            cat << EOF >> release_body.md

          ### 3D Projection Engine & Visuals
          ${VISUAL_LOG}
          EOF
          fi

          if [ -n "$FIX_LOG" ]; then
            cat << EOF >> release_body.md

          ### Bug Fixes & Crash Shields
          ${FIX_LOG}
          EOF
          fi

          if [ -n "$PERF_LOG" ]; then
            cat << EOF >> release_body.md

          ### Performance & Memory Optimizations
          ${PERF_LOG}
          EOF
          fi

          if [ -n "$DOCS_LOG" ]; then
            cat << EOF >> release_body.md

          ### Documentation & Configuration
          ${DOCS_LOG}
          EOF
          fi

          if [ -n "$CHORE_LOG" ]; then
            cat << EOF >> release_body.md

          ### Build & CI/CD Pipelines
          ${CHORE_LOG}
          EOF
          fi

          if [ -n "$OTHER_LOG" ]; then
            cat << EOF >> release_body.md

          ### Additional Updates
          ${OTHER_LOG}
          EOF
          fi

          cat << EOF >> release_body.md

          ---

          ## Verified Compatibility Matrix
          | Dependency / Mod | Configured Target Version | Loader | Notes |
          | :--- | :--- | :--- | :--- |
          | **Minecraft** | \`${MC_VER}\` | Fabric / NeoForge | Base game engine |
          | **Cobblemon** | \`${COBBLEMON_VER}\` | Fabric / NeoForge | Core Pokémon framework |
          | **Architectury API** | \`${ARCH_VER}\` | Fabric / NeoForge | Cross-loader abstraction |
          | **Fabric API** | \`${FABRIC_VER}\` | Fabric | Fabric event and registry bus |
          | **NeoForge** | \`${NEO_VER}\` | NeoForge | NeoForge mod platform |
          | **Cobblebase** | \`>=2.0.0\` | Fabric / NeoForge | 42+ Virtual Palworld jobs & team auras |
          | **Cobbreeding** | \`${BREEDING_VER}\` | Fabric / NeoForge | Virtual egg incubation & Mirror Herb moves |
          | **Cobbleworkers** | \`${WORKERS_VER}\` | Fabric / NeoForge | Field tasks (Pickup, Fishing, Diving, Archaeology) |

          ---

          ## Core System Summary
          * **Zero Server Lag**: Virtualizes Pokémon jobs inside pasture blocks with 0 physical entities spawned.
          * **3D Visual Projections**: Client-side Cyber Wireframe, Sci-Fi Hologram, and Ethereal Ghost modes with zero player push collision and native heightmap snapping.
          * **27-Slot Storage**: Built-in container collecting all crops, mined minerals, items, and eggs with automated hopper extraction.
          * **Draggable HUD**: In-game \`[⚙]\` editor to reposition overlay coordinates.

          ---

          ## Open Source Credits & Attributions
          * **[LunazStudios](https://github.com/LunazStudios)** — Creator of the original *Cobblemon Virtual Loot*.
          * **[notlown](https://github.com/notlown)** — Creator of *Cobblebase*.
          * **[The Cobblemon Team](https://cobblemon.com/)** — Creators of Cobblemon.
          * **[ludichat](https://github.com/ludichat)** — Creator of *Cobbreeding*.
          * **[Accieo](https://github.com/Accieo)** — Creator of *Cobbleworkers*.
          * **[The SVCMC Team](https://github.com/the-svcmc-team)** — Creators of *svc-holograms* for the holographic shader pipeline.
          * **gxenzy & Contributors** — Extended edition compatibility bridge, 3D visual projection engine, zero-push physics, draggable HUD editor, and automated release workflows.

          *Licensed under the [MIT License](LICENSE.txt).*
          EOF

      - name: Upload Mod Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLoot-Extended-Jars
          path: release_jars/*.jar

      - name: Publish Versioned GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Virtual Loot: Extended [${{ env.MC_VERSION }}] ${{ env.RELEASE_TAG }} - ${{ env.VERSION_SUBTITLE }}"
          body_path: release_body.md
          prerelease: ${{ env.VERSION_TYPE != 'Release' }}
          files: release_jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
