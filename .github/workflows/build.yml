name: Build & Release Virtual Loot (Extended Edition)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version Type (Release, Beta, Alpha)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Beta
          - Alpha
      custom_title:
        description: 'Custom Version Title (e.g. 3D Visual Projections & Universal Cobblebase Integration)'
        required: false
        default: '3D Visual Projections & Universal Cobblebase Integration'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Clean Production JARs
        run: |
          mkdir -p release_jars
          find fabric/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          find neoforge/build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} release_jars/ \;
          echo "Cleaned production jars:"
          ls -la release_jars/

      - name: Extract Metadata & Configuration
        id: meta
        run: |
          MOD_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          
          VER_TYPE="${{ github.event.inputs.version_type }}"
          if [ -z "$VER_TYPE" ]; then
            if [[ "$GITHUB_REF" == *"alpha"* ]]; then
              VER_TYPE="Alpha"
            elif [[ "$GITHUB_REF" == *"beta"* ]]; then
              VER_TYPE="Beta"
            else
              VER_TYPE="Release"
            fi
          fi
          
          SUBTITLE="${{ github.event.inputs.custom_title }}"
          if [ -z "$SUBTITLE" ]; then
            SUBTITLE="3D Visual Projections & Universal Cobblebase Integration"
          fi
          
          TAG="v${MOD_VER}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          
          echo "MOD_VERSION=$MOD_VER" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VER" >> $GITHUB_ENV
          echo "VERSION_TYPE=$VER_TYPE" >> $GITHUB_ENV
          echo "VERSION_SUBTITLE=$SUBTITLE" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Generate Dynamic Release Notes Body
        run: |
          # 1. Parse versions dynamically from gradle.properties
          MOD_VER=$(grep "mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          COBBLEMON_VER=$(grep "cobblemon_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          ARCH_VER=$(grep "architectury_api_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          FABRIC_VER=$(grep "fabric_api_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          NEO_VER=$(grep "neoforge_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          BREEDING_VER=$(grep "cobbreeding_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          WORKERS_VER=$(grep "cobbleworkers_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          REPO_URL="https://github.com/${{ github.repository }}"

          # 2. Determine git range for full or incremental changelog
          git fetch --tags --force 2>/dev/null || true
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n 1)
          
          if [ -n "$PREV_TAG" ] && [ "${RELEASE_TAG}" != "v1.0.0" ]; then
            RANGE="${PREV_TAG}..HEAD"
            RANGE_TITLE="Changes since ${PREV_TAG}"
            COMPARE_LINK="[Full Diff View](${REPO_URL}/compare/${PREV_TAG}...${RELEASE_TAG})"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
            RANGE_TITLE="Complete Version Changelog (All Project Commits)"
            COMPARE_LINK="[Repository Tree](${REPO_URL}/tree/${RELEASE_TAG})"
          fi

          # 3. Categorize commits dynamically
          FEAT_LOG=""
          VISUAL_LOG=""
          COBBLEBASE_LOG=""
          COMPAT_LOG=""
          ROAM_LOG=""
          PERF_LOG=""
          DOCS_LOG=""
          CHORE_LOG=""
          OTHER_LOG=""

          COMMIT_COUNT=0
          while IFS='|' read -r hash author title; do
            [ -z "$hash" ] && continue
            COMMIT_COUNT=$((COMMIT_COUNT + 1))
            LINE="* ${title} ([${hash}](${REPO_URL}/commit/${hash}))"
            case "${title,,}" in
              *feat\(visual*|*fix\(visual*|*feat*visual*|*fix*visual*|*shader*|*wireframe*|*hologram*|*ghost*|*particle*|*beam*)
                VISUAL_LOG="${VISUAL_LOG}"$'\n'"${LINE}"
                ;;
              *cobblebase*|*job*|*produce*|*aura*|*admin*screen*)
                COBBLEBASE_LOG="${COBBLEBASE_LOG}"$'\n'"${LINE}"
                ;;
              *compat*|*cobbreeding*|*cobbleworker*|*safety*|*crash*)
                COMPAT_LOG="${COMPAT_LOG}"$'\n'"${LINE}"
                ;;
              *roam*|*pasture*|*entity*|*wander*|*collision*|*raycast*|*floor*)
                ROAM_LOG="${ROAM_LOG}"$'\n'"${LINE}"
                ;;
              *perf*|*optimi*|*deadlock*|*freeze*|*zero-lag*|*sync*)
                PERF_LOG="${PERF_LOG}"$'\n'"${LINE}"
                ;;
              *doc*|*readme*|*sprite*|*taxonom*|*database*|*audit*)
                DOCS_LOG="${DOCS_LOG}"$'\n'"${LINE}"
                ;;
              *chore*|*ci*|*build*|*gradle*|*workflow*|*release*)
                CHORE_LOG="${CHORE_LOG}"$'\n'"${LINE}"
                ;;
              *)
                OTHER_LOG="${OTHER_LOG}"$'\n'"${LINE}"
                ;;
            esac
          done < <(git log ${RANGE} --pretty=format:"%h|%an|%s" 2>/dev/null || git log --pretty=format:"%h|%an|%s")

          # 4. Generate dynamic file checksum table
          JAR_TABLE="| Filename | File Size | SHA-256 Checksum |"$'\n'"| :--- | :---: | :--- |"
          for jar in release_jars/*.jar; do
            if [ -f "$jar" ]; then
              FNAME=$(basename "$jar")
              FSIZE=$(ls -lh "$jar" | awk '{print $5}')
              FSHA=$(sha256sum "$jar" | awk '{print $1}')
              JAR_TABLE="${JAR_TABLE}"$'\n'"| \`${FNAME}\` | ${FSIZE} | \`${FSHA}\` |"
            fi
          done

          # 5. Assemble dynamic release_body.md
          cat << EOF > release_body.md
> **Release Status:** **${{ env.VERSION_TYPE }}** (${{ env.VERSION_TYPE == 'Release' && 'Production Stable Build' || 'Development Build' }})  
> **Target Minecraft:** \`${MC_VER}\`  
> **Installation Scope:** **Client & Server**  
> **Supported Mod Loaders:** Fabric, NeoForge  

---

## Production Release Artifacts
${JAR_TABLE}

---

## Executive Feature Summary
* **True Zero-Lag Virtual Pastures**: Full background automation of Cobblebase Palworld jobs, Cobbreeding egg incubation, and Cobbleworkers field tasks with 0 physical entity tick overhead in Mode 0 (OFF).
* **3D Visual Projection Engine**: Switch between 3 client-side projection modes at the touch of a button:
  * **Mode 1 (Cyber Wireframe)**: 3D vector-edge mesh projection.
  * **Mode 2 (Sci-Fi Hologram)**: Translucent cyan energy silhouette with scanlines.
  * **Mode 3 (Ethereal Ghost)**: Translucent spirit form with levitation drift and soul flame particles.
  * **Teleport Materialization**: Spiral particle beams and dimensional teleport sounds on spawn and mode toggle.
* **Strict Pasture Isolation**: Normal wooden Cobblemon pastures are completely isolated and render 100% authentic physical models and textures.
* **Integrated 27-Slot Automation Container**: Built-in block storage collecting all harvested crops, ores, mob drops, and eggs with vanilla hopper, pipe, and chute compatibility.
* **Interactive Draggable HUD**: In-game customizable overlay editor with coordinate persistence.

---

## Automated Version Changelog (${RANGE_TITLE})
${COMPARE_LINK}
EOF

          if [ -n "$VISUAL_LOG" ]; then
            cat << EOF >> release_body.md

### 3D Projection Engine & Visual Shaders
${VISUAL_LOG}
EOF
          fi

          if [ -n "$COBBLEBASE_LOG" ]; then
            cat << EOF >> release_body.md

### Cobblebase & Virtual Job Simulation
${COBBLEBASE_LOG}
EOF
          fi

          if [ -n "$COMPAT_LOG" ]; then
            cat << EOF >> release_body.md

### Cross-Mod Compatibility & Crash Shields
${COMPAT_LOG}
EOF
          fi

          if [ -n "$ROAM_LOG" ]; then
            cat << EOF >> release_body.md

### Pasture Roaming, Physics & Entity AI
${ROAM_LOG}
EOF
          fi

          if [ -n "$PERF_LOG" ]; then
            cat << EOF >> release_body.md

### Performance, Networking & Zero-Lag Architecture
${PERF_LOG}
EOF
          fi

          if [ -n "$DOCS_LOG" ]; then
            cat << EOF >> release_body.md

### Documentation, Item Sprites & Species Classification
${DOCS_LOG}
EOF
          fi

          if [ -n "$CHORE_LOG" ]; then
            cat << EOF >> release_body.md

### Build, Packaging & CI/CD Pipelines
${CHORE_LOG}
EOF
          fi

          if [ -n "$OTHER_LOG" ]; then
            cat << EOF >> release_body.md

### Additional Updates
${OTHER_LOG}
EOF
          fi

          cat << EOF >> release_body.md

---

## Verified Compatibility Matrix
| Dependency / Mod | Target Version | Loader | Notes |
| :--- | :--- | :--- | :--- |
| **Minecraft** | \`${MC_VER}\` | Fabric / NeoForge | Base game engine |
| **Cobblemon** | \`${COBBLEMON_VER}\` | Fabric / NeoForge | Core Pokémon framework |
| **Architectury API** | \`${ARCH_VER}\` | Fabric / NeoForge | Cross-loader abstraction |
| **Fabric API** | \`${FABRIC_VER}\` | Fabric | Fabric event and registry bus |
| **NeoForge** | \`${NEO_VER}\` | NeoForge | NeoForge mod platform |
| **Cobblebase** | \`>=2.0.0\` | Fabric / NeoForge | 42+ Virtual Palworld jobs & team auras |
| **Cobbreeding** | \`${BREEDING_VER}\` | Fabric / NeoForge | Virtual egg incubation & Mirror Herb moves |
| **Cobbleworkers** | \`${WORKERS_VER}\` | Fabric / NeoForge | Field tasks (Pickup, Fishing, Diving, Archaeology) |

